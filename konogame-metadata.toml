# Canonical project and release metadata. Use dev-cli release to synchronize projections.
schema_version = 1

[project]
name = "konogame"
display_name = "Konogame"
version = "0.1.0-alpha.0"
description = "An extensible, capability-oriented framework for managing game assets."
license = "MPL-2.0"
repository_url = "https://github.com/apeiraco/konogame"

# Protocol versions evolve separately from npm package release versions.
[declaration_protocol]
version = "0.2.0"
supported_range = ">=0.2.0 <0.3.0"
package = "@konogame/infrastructure"
source = "packages/infrastructure/src/contracts/version.ts"

[tooling.typescript]
config = "tsconfig.json"

[release]
tag_prefix = "v"
changelog = "CHANGELOG.md"
translations = { zh = "docs/zh/CHANGELOG.md" }

[[core_package]]
name = "konogame"
manifest = "package.json"

[[core_package]]
name = "@konogame/infrastructure"
manifest = "packages/infrastructure/package.json"

[[core_package]]
name = "@konogame/node-installed-extension-source"
manifest = "packages/node-installed-extension-source/package.json"

[[core_package]]
name = "@konogame/workspace"
manifest = "packages/workspace/package.json"

[[core_package]]
name = "@konogame/game"
manifest = "packages/game/package.json"

[[core_package]]
name = "@konogame/save"
manifest = "packages/save/package.json"

[[core_package]]
name = "@konogame/cli"
manifest = "apps/cli/package.json"

[[core_package]]
name = "@konogame/daemon"
manifest = "apps/daemon/package.json"

[[core_package]]
name = "@konogame/dev-cli"
manifest = "scripts/dev-cli/package.json"

[[core_package]]
name = "@konogame/webui"
manifest = "apps/webui/package.json"

# Extensions have independent versions, even when their initial version matches core.
[[extension]]
id = "konogame.filesystem"
package = "@konogame/extension-filesystem"
manifest = "extensions/filesystem/package.json"
version = "0.1.0-alpha.0"
declaration_protocol_range = ">=0.2.0 <0.3.0"
source = "extensions/filesystem/src/metadata.ts"
software = { node = ">=26" }
port_version_ranges = { "filesystem.save-store" = ">=0.2.0 <0.3.0", "filesystem.location" = ">=0.2.0 <0.3.0", "filesystem.game-discovery" = ">=0.3.0 <0.4.0", "filesystem.workspace-location-browser" = ">=0.2.0 <0.3.0" }

[[extension]]
id = "konogame.steam"
package = "@konogame/extension-steam"
manifest = "extensions/steam/package.json"
version = "0.1.0-alpha.0"
declaration_protocol_range = ">=0.2.0 <0.3.0"
source = "extensions/steam/src/metadata.ts"
software = { steam = "generic" }
port_version_ranges = { "steam.game-discovery" = ">=0.3.0 <0.4.0" }

[[extension]]
id = "konogame.workspace-toml"
package = "@konogame/extension-workspace-toml"
manifest = "extensions/workspace-toml/package.json"
version = "0.1.0-alpha.0"
declaration_protocol_range = ">=0.2.0 <0.3.0"
source = "extensions/workspace-toml/src/metadata.ts"
software = { toml = ">=1.0.0 <1.1.0" }
port_version_ranges = { "workspace-toml.configuration" = ">=0.2.0 <0.3.0" }

# Each Port evolves independently of the declaration protocol and package releases.

[[port]]
id = "location.behavior"
version = "0.2.0"
supported_range = ">=0.2.0 <0.3.0"
package = "@konogame/infrastructure"
source = "packages/infrastructure/src/contracts/port-versions.ts"

[[port]]
id = "blob"
version = "0.2.0"
supported_range = ">=0.2.0 <0.3.0"
package = "@konogame/infrastructure"
source = "packages/infrastructure/src/contracts/port-versions.ts"

